    <nav class="container inner-nav">
        <div class="inner-nav-ctr">
            <button id="menu-button" class="menu-button">
                <i class="material-icons">menu</i>
            </button>
            {{/*  Theme switcher  */}}
            <div class="theme-switcher">
                <label class="switch">
                    <input type="checkbox" id="theme-switcher">
                    <div class="slider round"></div>
                </label>
            </div>

            {{/*  Theme switch script  */}}
            <script>
                document.addEventListener('DOMContentLoaded', function() {
                    const themeSwitcher = document.getElementById('theme-switcher');
                
                    // Load saved theme preference
                    const savedTheme = localStorage.getItem('theme');
                    if (savedTheme === 'light') {
                        document.documentElement.classList.add('light');
                        themeSwitcher.checked = true;
                    } else {
                        document.documentElement.classList.remove('light');
                        themeSwitcher.checked = false;
                    }
                
                    // Handle toggle switch
                    themeSwitcher.addEventListener('change', function() {
                        if (this.checked) {
                            document.documentElement.classList.add('light');
                            localStorage.setItem('theme', 'light');
                        } else {
                            document.documentElement.classList.remove('light');
                            localStorage.setItem('theme', 'dark');
                        }
                    });
                });
            </script>
            <div id="search-container" role="search" style="position: relative;">
                <input type="search" id="search-box" placeholder="Search mods..."
                       aria-label="Search mods"
                       role="combobox" aria-autocomplete="list"
                       aria-controls="search-results" aria-expanded="false"
                       autocomplete="off" spellcheck="false">
                <ul id="search-results" role="listbox" aria-label="Search results" tabindex="-1"></ul>

                    kofiwidget2.draw();
                </script>
            </div>
        </div>
    </nav>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        // clear search box if page reloaded
        const searchBox = document.getElementById('search-box');
        const resultsContainer = document.getElementById('search-results');
      
        searchBox.value = ''; // clear the search box
        resultsContainer.innerHTML = ''; // remove any previous results
      });

    let searchIndex;

    function toProperCase(str) {
        return str
          .split(' ') // Split the string into words
          .map(word => word.charAt(0).toUpperCase() + word.slice(1)) // Capitalize first letter of each word
          .join(' '); // Join the words back into a single string
    }

    // Function to highlight matching characters
    const escapeRegex = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    function highlightMatch(text, query) {
        return text.replace(new RegExp(`(${escapeRegex(query)})`, 'gi'), '<strong class="highlight-result">$1</strong>'); // Wrap match in <strong> for bold
    }
    
  
    // get the JSON data
    fetch('/index.json')
      .then(response => response.json())
      .then(data => {
        console.log('Fetched JSON data:', data);
  
        // init Lunr.js
        searchIndex = lunr(function () {
          this.ref('url'); 
          this.field('title');
          this.field('game');
          this.field('contents'); 
          this.field('author');
  
          data.forEach(doc => {
            console.log('Adding document to index:', doc);
  
            // combine all content into a single string
            const aggregatedContents = doc.contents.join(' ');
            this.add({
            url: doc.url,
            title: doc.title.toLowerCase(),
            author: (doc.author || '').toString().toLowerCase(),
            game: (doc.game || '').toLowerCase(),
            contents: (doc.contents || []).join(' ').toLowerCase()
            });
          });
        });
  
        console.log('Lunr.js index initialized:', searchIndex);
  
        // store data in global variable for later retrieval
        window.searchDocs = data.reduce((acc, doc) => {
            acc[doc.url] = {
              ...doc, // Ensure all fields, including 'game', are stored
            };
            return acc;
          }, {});
                })
      .catch(error => console.error('Error fetching or processing JSON:', error));
  
    // live search start
    document.getElementById('search-box').addEventListener('input', function () {
      const query = this.value.trim().toLowerCase();
      const safe = query.replace(/[:~^+\-*]/g, ' ').trim();
      var results = [];
      const resultsContainer = document.getElementById('search-results');
      resultsContainer.innerHTML = ''; // erase prev results
    
      // if no results, display: none search-results and return
      if (query.length === 0 || !searchIndex) {
        resultsContainer.style.display = 'none';
        return;
      }

        resultsContainer.style.display = 'flex';
        resultsContainer.style.flexDirection = 'column';
  
      // wildcard to get partial matches
      const exactMatchResults = searchIndex.search(query);
      const partialResults = searchIndex.search(`*${query}*`)
      // combine exact and partial matches, remove duplicates
      try {
        results = [...new Map([...searchIndex.search(safe), ...searchIndex.search(safe.split(/\s+/).map(t => t + '*').join(' '))]
            .map(r => [r.ref, r])).values()];
        } catch (e) { /* show "No results" */ }
      console.log('Search results:', results);

    // if characters are in search box but no results, "No results found" message
    if (results.length === 0) {
        const listItem = document.createElement('li');
        listItem.textContent = 'No results found';
        listItem.className = 'no-results';
        resultsContainer.appendChild(listItem);
        return;
    }

  
    results.slice(0, 10).forEach(result => {
        // get the matching document
        const doc = window.searchDocs[result.ref];
        console.log('Matching document:', doc);
  
        const link = document.createElement('a');
        link.href = doc.url;
        // make title proper case
        link.innerHTML = highlightMatch(toProperCase(doc.title), query);
  
        // add game name to search results
        const author = doc.author ? `by ${doc.author}` : '';
        // if 'zoo tycoon 1' then 'zt1' or 'zoo tycoon 2' then 'zt2'
        const game = doc.game === 'zoo tycoon 1' ? 'ZT1' : doc.game === 'zoo tycoon 2' ? 'ZT2' : 'Assets';
        const span = document.createElement('span');
        span.textContent = `${game}`;
        span.className = doc.game === 'zoo tycoon 1' ? 'res-badge span-zt1' : doc.game === 'zoo tycoon 2' ? 'res-badge span-zt2' : doc.game === 'assets' ? 'res-badge span-assets' : '';
        link.appendChild(span);

        // by author
        const author_span = document.createElement('span');
        author_span.textContent = `${author}`;
        author_span.className = 'list-results-author';
        link.appendChild(author_span);

        // add the link to the search results
        const listItem = document.createElement('li');
        
        // if the string exists within 'contents', show the string under the list result
        const matchingContents = doc.contents.filter(item => item.toLowerCase().includes(query));
        if (matchingContents.length > 0) {
            const sublist = document.createElement('ul');
            sublist.className = 'sublist';
            sublist.style.marginLeft = '16px'; // Indent sublist

            // header for sublist
            const contents_span = document.createElement('li');
            contents_span.textContent = 'Found inside:';
            contents_span.className = 'sublist-header';
            sublist.appendChild(contents_span);

            matchingContents.forEach(content => {
                const subItem = document.createElement('li');
                subItem.innerHTML = highlightMatch(toProperCase(content), query); // Display in proper case
                sublist.appendChild(subItem);
            });


            link.appendChild(sublist);

        }

        listItem.appendChild(link);
        resultsContainer.appendChild(listItem);
        }); 
    });
  </script>
  <script>

    (function () {
    const box = document.getElementById('search-box');
    const list = document.getElementById('search-results');
    const container = document.getElementById('search-container');
    if (!box || !list || !container) return;

    let active = -1;
    const options = () => Array.from(list.querySelectorAll(':scope > li > a'));
    const hasResults = () => list.children.length > 0;

    function setActive(i) {
        const items = options();
        items.forEach((a, n) => a.classList.toggle('is-active', n === i));
        active = i;
        if (items[i]) {
        box.setAttribute('aria-activedescendant', items[i].id);
        items[i].scrollIntoView({ block: 'nearest' });
        } else {
        box.removeAttribute('aria-activedescendant');
        }
    }

    function open() {
        if (!box.value.trim() || !hasResults()) return;
        list.style.display = 'flex';
        box.setAttribute('aria-expanded', 'true');
    }

    function close() {
        list.style.display = 'none';
        box.setAttribute('aria-expanded', 'false');
        setActive(-1);
    }

    // reset active selection on input change
    box.addEventListener('input', () => {
        active = -1;
        box.removeAttribute('aria-activedescendant');
        list.querySelectorAll(':scope > li').forEach(li => li.setAttribute('role', 'presentation'));
        options().forEach((a, n) => { a.id = 'search-option-' + n; a.setAttribute('role', 'option'); a.tabIndex = -1; });
        box.setAttribute('aria-expanded', String(list.style.display !== 'none' && hasResults()));
    });

    box.addEventListener('keydown', (e) => {
        const items = options();
        switch (e.key) {
        case 'ArrowDown':
            e.preventDefault();
            open();
            if (items.length) setActive(active < items.length - 1 ? active + 1 : 0);
            break;
        case 'ArrowUp':
            e.preventDefault();
            if (items.length) setActive(active > 0 ? active - 1 : items.length - 1);
            break;
        case 'Enter':
            if (active >= 0 && items[active]) { e.preventDefault(); window.location.href = items[active].href; }
            else if (items.length === 1) { e.preventDefault(); window.location.href = items[0].href; }
            break;
        case 'Escape':
            if (list.style.display !== 'none' && hasResults()) { e.preventDefault(); close(); }
            break;
        }
    });

    // reopen with prev results when focusing back on the search box
    box.addEventListener('focus', open);

    // close when clicking or tabbing elsewhere
    document.addEventListener('click', (e) => { if (!container.contains(e.target)) close(); });
    container.addEventListener('focusout', (e) => { if (!container.contains(e.relatedTarget)) close(); });

    // make mouse hover active selection
    list.addEventListener('mousemove', (e) => {
        const a = e.target.closest('#search-results > li > a');
        if (a) setActive(options().indexOf(a));
    });
    })();
</script>
